name: Release
# Push a tag like v0.5.0: CI (.github/workflows/ci.yml) builds and tests the plugin for Windows,
# Linux and macOS from this public source, then this publishes the packages with SHA-256
# checksums and a build-provenance attestation (gh attestation verify <file> -R bask209/obs-tab-player).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write     # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: obs-tab-player-*
          merge-multiple: true
      - name: Checksums
        run: |
          ls -l
          sha256sum *-setup.exe *.zip *.tar.gz *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            *-setup.exe
            *.zip
            *.tar.gz
            *.deb
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" *-setup.exe *.zip *.tar.gz *.deb SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --title "OBS Tab Player ${GITHUB_REF_NAME}" --generate-notes ${prerelease}
