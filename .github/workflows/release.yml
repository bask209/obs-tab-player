name: Release
# Push a tag like v0.8.0: CI (.github/workflows/ci.yml) builds and tests the plugin for Windows,
# Linux and macOS from this public source, then this publishes the packages with SHA-256
# checksums and a build-provenance attestation (gh attestation verify <file> -R bask209/obs-tab-player).
on:
  push:
    tags: ['v*']
  workflow_dispatch: # publish an existing tag again, e.g. after fixing this workflow
    inputs:
      tag:
        description: Existing tag to publish (its source must match the branch this runs on)
        required: true
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write     # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: obs-tab-player-*
          merge-multiple: true
      - name: Checksums
        run: |
          # the packages, wherever the artifacts put them
          find . -mindepth 2 -type f \( -name '*-setup.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' \) -exec mv {} . \;
          ls -l
          sha256sum *-setup.exe *.zip *.tar.gz *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            *-setup.exe
            *.zip
            *.tar.gz
            *.deb
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" *-setup.exe *.zip *.tar.gz *.deb SHA256SUMS.txt --verify-tag --repo "${GITHUB_REPOSITORY}" --title "OBS Tab Player $tag" --generate-notes ${prerelease}
