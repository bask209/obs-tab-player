name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # The engine built to WebAssembly (as on the website) and tested in Node.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Emscripten (version pinned in package.json)
        shell: bash
        run: |
          v=$(node -p "require('./package.json').config.emscripten")
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$v"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$v"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - run: npm test
  native-engine:
    # The same engine built natively with MSVC (warnings as errors), plus tabtool.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S plugin -B build/tools -DTAB_BUILD_PLUGIN=OFF
      - run: cmake --build build/tools --config Release
      - name: Read every demo tab
        shell: bash
        run: for f in docs/demo/*.gp5; do build/tools/Release/tabtool.exe timeline "$f" > /dev/null; done
  plugin:
    # Windows: the OBS plugin itself (with the OBS SDK) and the installer, like a release.
    runs-on: windows-2022
    needs: native-engine
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cache the OBS SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deps
          key: obs-sdk-${{ hashFiles('tools/obs-sdk.ps1') }}
      - name: OBS SDK
        run: ./tools/obs-sdk.ps1 -Dest .deps
      - name: Configure (warnings as errors)
        run: cmake -S plugin -B build/plugin -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$PWD/.deps;$PWD/.deps/qt6;$PWD/.deps/deps"
      - name: Build
        run: cmake --build build/plugin --config Release --parallel
      - name: Package (setup.exe, zip, checksums)
        run: ./tools/package-plugin.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-tab-player-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS.txt
  linux:
    # Linux: the plugin built against OBS's own Ubuntu package, then played inside that OBS on a
    # virtual display (tests/obs-smoke.mjs), then packaged.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OBS 31.1.1 (pinned) and the build tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/obs.deb" https://github.com/obsproject/obs-studio/releases/download/31.1.1/obs-studio_31.1.1-0obsproject1.noble_amd64.deb
          echo "4d6c44540c73e937e23cf47ef180d0ef825fbfb63755866f377aa63b9eb8e7be  $RUNNER_TEMP/obs.deb" | sha256sum -c
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$RUNNER_TEMP/obs.deb" qt6-base-dev qt6-base-private-dev ninja-build xvfb
      - name: Build (warnings as errors)
        run: |
          cmake -S plugin -B build/plugin -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/plugin
      - name: Play a tab inside OBS
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node tests/obs-smoke.mjs --obs obs --plugin build/plugin/obs-tab-player.so --shot dist-linux-tab.png
      - name: Package (tar.gz, deb)
        run: bash tools/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: obs-tab-player-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist-linux-tab.png
  macos:
    # macOS: the OBS SDK from source and OBS's universal dependencies (pinned), then a universal
    # plugin bundle (Apple silicon and Intel), then the zip with Install.command.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the OBS SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deps
          key: obs-sdk-macos-${{ hashFiles('tools/obs-sdk.sh') }}
      - name: OBS SDK
        run: bash tools/obs-sdk.sh .deps
      - name: Build (warnings as errors)
        run: |
          cmake -S plugin -B build/plugin -G Xcode "-DCMAKE_PREFIX_PATH=$PWD/.deps;$PWD/.deps/qt6;$PWD/.deps/deps" "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/plugin --config Release --target obs-tab-player
      - name: Package (zip with Install.command)
        run: bash tools/package-macos.sh
      - name: Try a tab inside OBS (macOS runners may have no GPU for OBS)
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/obs.dmg" https://github.com/obsproject/obs-studio/releases/download/31.1.1/OBS-Studio-31.1.1-macOS-Apple.dmg
          echo "f649fd6ef36ef87d3df0be76c92ea793129bb28a95630e77cb49a3fa5eeec6c3  $RUNNER_TEMP/obs.dmg" | shasum -a 256 -c
          hdiutil attach -nobrowse -quiet -mountpoint "$RUNNER_TEMP/obs" "$RUNNER_TEMP/obs.dmg"
          node tests/obs-smoke.mjs --obs "$RUNNER_TEMP/obs/OBS.app/Contents/MacOS/OBS" --plugin "$(find build/plugin -name obs-tab-player.plugin -type d | head -1)" --shot dist-macos-tab.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: obs-tab-player-macos-universal
          path: |
            dist/*macos*.zip
            dist-macos-tab.png
