<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Player</title>
<link rel="stylesheet" href="css/dock.css">
</head>
<body>
<section id="now">
  <div class="row between"><span id="conn" class="pill">connecting…</span><span id="fmt" class="muted small"></span></div>
  <div id="nowTitle">—</div>
  <div id="nowInfo" class="muted small"></div>
  <div id="progress" title="Click to jump"><div id="progressBar"></div></div>
</section>

<section id="transport">
  <button data-cmd="prevDay" title="Previous day">⏮</button>
  <button data-cmd="prevFile" title="Previous tab / version">‹</button>
  <button data-cmd="playPause" id="playBtn" class="primary" title="Play / pause (Space)">▶</button>
  <button data-cmd="stop" title="Stop">■</button>
  <button data-cmd="nextFile" title="Next tab / version">›</button>
  <button data-cmd="nextDay" title="Next day">⏭</button>
</section>

<section id="tempo">
  <div class="row between nowrap">
    <button data-cmd="speedDown" class="big" title="Slower 5% (−)">−</button>
    <label id="bpmBox"><input id="bpm" type="number" min="10" max="400" step="1" title="Target BPM"><span>BPM</span></label>
    <button data-cmd="speedUp" class="big" title="Faster 5% (+)">+</button>
  </div>
  <div class="row nowrap"><input id="speed" type="range" min="0.25" max="2" step="0.05"><span id="speedLabel" class="muted small mono"></span></div>
  <div class="row chips" id="speedChips">
    <button data-speed="0.5">0.5×</button><button data-speed="0.75">0.75×</button><button data-speed="1">1×</button><button data-speed="1.25">1.25×</button><button data-speed="1.5">1.5×</button>
  </div>
  <div class="row chips" id="rangeChips"></div>
</section>

<section id="practice">
  <label class="check"><input type="checkbox" data-key="loop"> Loop</label>
  <label class="check"><input type="checkbox" data-key="countIn"> Count-in</label>
  <label class="check"><input type="checkbox" data-key="metronome"> Metronome</label>
  <div class="row small">Bars <input id="loopFrom" type="number" min="0" step="1" placeholder="from"> – <input id="loopTo" type="number" min="0" step="1" placeholder="to"> <button id="loopAll" title="Loop the whole piece">all</button></div>
</section>

<section id="pick">
  <input id="search" type="search" placeholder="Search: 4 · 10-20 · arpeggio · sweep" autocomplete="off" spellcheck="false">
  <div id="count" class="muted small"></div>
  <ul id="list" tabindex="0" role="listbox" aria-label="Tabs"></ul>
</section>

<details id="look">
  <summary>Look</summary>
  <div class="grid">
    <label>Theme
      <select data-key="theme">
        <option value="light">Light card</option><option value="dark">Dark card</option><option value="glass">Glass</option>
        <option value="clear">Transparent</option><option value="neon">Neon</option><option value="paper">Paper</option>
      </select>
    </label>
    <label>Font
      <select data-key="font"><option value="sans">Sans</option><option value="rounded">Rounded</option><option value="mono">Mono</option><option value="serif">Serif</option></select>
    </label>
    <label>Layout
      <select data-key="layout"><option value="page">Rows (page)</option><option value="horizontal">One line (scrolls)</option></select>
    </label>
    <label>Cursor
      <select data-key="cursor"><option value="both">Bar + line</option><option value="line">Line</option><option value="bar">Bar</option><option value="none">None</option></select>
    </label>
    <label>Left of staff
      <select data-key="labels"><option value="tab">TAB</option><option value="names">String names</option><option value="none">Nothing</option></select>
    </label>
    <label>Text panel
      <select data-key="panel"><option value="top">Top</option><option value="bottom">Bottom</option><option value="hidden">Hidden</option></select>
    </label>
    <label>Size <span id="zoomLabel" class="muted"></span>
      <input type="range" data-key="zoom" data-num min="0.6" max="2.5" step="0.05">
    </label>
    <label>Track
      <select id="track"></select>
    </label>
    <label class="check"><input type="checkbox" data-key="colorStrings"> Coloured strings</label>
    <label class="check"><input type="checkbox" data-key="bold"> Bold</label>
    <label class="check"><input type="checkbox" data-key="rhythm"> Rhythm</label>
    <label class="check"><input type="checkbox" data-key="barNumbers"> Bar numbers</label>
    <label class="check"><input type="checkbox" data-key="highlightNotes"> Light up notes</label>
    <label class="check"><input type="checkbox" data-key="showNotes"> Exercise text</label>
    <label class="check"><input type="checkbox" data-key="showAllNotes"> All text lines</label>
  </div>
</details>

<details id="sound">
  <summary>Sound</summary>
  <div class="grid">
    <label>Tone
      <select data-key="tone"><option value="clean">Clean</option><option value="warm">Warm</option><option value="crunch">Crunch</option></select>
    </label>
    <label>Cursor offset <span id="offsetLabel" class="muted"></span>
      <input type="range" data-key="avOffset" data-num min="-300" max="300" step="10">
    </label>
    <label>Guitar volume <input type="range" data-key="volume" data-num min="0" max="1.5" step="0.05"></label>
    <label>Click volume <input type="range" data-key="clickVolume" data-num min="0" max="1.5" step="0.05"></label>
  </div>
  <div class="row small"><button id="rescan">Rescan tab folder</button><span id="libPath" class="muted"></span></div>
</details>

<script type="module" src="js/dock.js"></script>
</body>
</html>
