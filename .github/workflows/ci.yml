name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the OBS script compiles (LuaJIT, as used by OBS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          luajit -bl player/tab-player.lua > /dev/null
